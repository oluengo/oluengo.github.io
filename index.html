:root {

	--fg: light-dark(#1A1A1A, #E6E6E6);

	--line: light-dark(#E4E4E4, #2A2A2A);
	--accent: light-dark(#0B57D0, #8AB4F8);

}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0 auto; max-width: 46rem; padding: 2.5rem 1rem 3rem; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font); -webkit-text-size-adjust: 100%; }
a { color: var(--accent); text-decoration: none; overflow-wrap: anywhere; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 1px dashed var(--accent); outline-offset: 2px; }
svg.i { width: 1.1rem; height: 1.1rem; display: block; }

.header { display: grid; grid-template-columns: auto 1fr auto; column-gap: 1rem; align-items: center; padding-bottom: 1.5rem; }
.avatar { width: 3rem; height: 3rem; border-radius: 50%; border: 1px solid var(--line); display: block; }
.title { font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
.sub { color: var(--muted); font-size: .85rem; }
.tools { display: flex; align-items: center; gap: .6rem; font-size: .8rem; color: var(--muted); }
.lang { display: flex; gap: .1rem; }
.lang button, #theme { font: inherit; background: none; border: 0; color: var(--muted); cursor: pointer; padding: .2rem .35rem; border-radius: 4px; }
.lang button:hover, #theme:hover { color: var(--fg); }
.lang button[aria-pressed="true"] { color: var(--fg); font-weight: 700; }
#theme { display: grid; place-items: center; }
.i-sun { display: none !important; }
:root[data-theme="dark"] .i-sun { display: block !important; } :root[data-theme="dark"] .i-moon { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .i-sun { display: block !important; } :root:not([data-theme="light"]) .i-moon { display: none; } }

.intro { color: var(--muted); margin: 0 0 2.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--line); }
h2 { font-size: .8rem; font-weight: 400; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 1rem; }
h2::before { content: "// "; opacity: .6; }

.apps { display: grid; gap: .75rem; margin-bottom: 3rem; }
.app { display: grid; grid-template-columns: auto 1fr auto; gap: 1rem; align-items: center; padding: 1rem 1.1rem; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: inherit; text-decoration: none !important; transition: border-color .15s, transform .15s; }
.app:hover { border-color: var(--accent); transform: translateY(-1px); }
.app img { width: 3rem; height: 3rem; border-radius: 22%; display: block; }
.app .name { font-weight: 700; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.app .desc { color: var(--muted); font-size: .85rem; margin-top: .1rem; }
.app .plat { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .45rem; }
.pill { font-size: .68rem; font-weight: 400; line-height: 1.5; padding: .05rem .55rem; border-radius: 999px; background: var(--tag-bg); color: var(--tag-fg); }
.pill.beta { background: none; border: 1px solid var(--line); color: var(--muted); }
.app .go { color: var(--muted); font-size: 1.2rem; }
.app:hover .go { color: var(--accent); }

.posts { list-style: none; margin: 0 0 1rem; padding: 0; }
.posts li { border-top: 1px solid var(--line); }
.posts li:last-child { border-bottom: 1px solid var(--line); }
.posts a { display: grid; grid-template-columns: 7.5rem 1fr; gap: 1rem; padding: .8rem 0; color: inherit; text-decoration: none; }
.posts a:hover .pt { color: var(--accent); }
.posts time { color: var(--muted); font-size: .8rem; padding-top: .1rem; }
.posts .pt { font-weight: 700; }
.posts .ps { color: var(--muted); font-size: .82rem; margin-top: .15rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.posts .loading { color: var(--muted); font-size: .85rem; padding: .8rem 0; border: 0; }
.more { font-size: .9rem; }

.footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; display: grid; gap: .75rem; }
.links { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
.links a { color: var(--muted); }
.links a:hover { color: var(--fg); }
#copied { font-size: .75rem; opacity: 0; transition: opacity .2s; }
#copied.show { opacity: 1; }
.license a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }

@media (max-width: 30rem) {

	.tools { grid-column: 1 / -1; }
	.posts a { grid-template-columns: 1fr; gap: .15rem; }
}

		`<a class="app" href="/${a.id}/?lang=${lang}"><img src="${a.icon}" alt=""><div><div class="name">${a.id[0].toUpperCase() + a.id.slice(1)}${a.beta ? '<span class="pill beta">beta</span>' : ""}</div><div class="desc">${esc(t.apps[a.id])}</div><div class="plat">${a.plat.map(p => `<span class="pill">${p}</span>`).join("")}</div></div><span class="go" aria-hidden="true">→</span></a>`).join("");
	document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
	renderPosts();
}
function renderPosts() {
	const ul = document.getElementById("posts");
	if (POSTS === null) { ul.innerHTML = `<li class="loading">${esc(I[L].loading)}</li>`; return; }
	if (!POSTS.length) { ul.innerHTML = `<li class="loading">${esc(I[L].noPosts)}</li>`; return; }
	const df = new Intl.DateTimeFormat(LOC[L], { day: "numeric", month: "short", year: "numeric" });
	ul.innerHTML = POSTS.map(p => `<li><a href="/blog/?lang=${L}#/post/${encodeURIComponent(p.slug)}"><time>${df.format(new Date(p.ts * 1000))}</time><div><div class="pt">${esc(p.title)}</div>${p.summary ? `<div class="ps">${esc(p.summary)}</div>` : ""}</div></a></li>`).join("");
}
const norm = t => String(t || "").trim().replace(/^#/, "").toLowerCase();
function toPosts(events, c) {
	const deleted = new Set();
	events.forEach(e => { if (e.kind === 5) e.tags.forEach(t => { if (t[0] === "e" || t[0] === "a") deleted.add(t[1]); }); });
	const map = new Map();
	for (const e of events) {
		if (e.kind === 5 || !c.kinds.includes(e.kind) || deleted.has(e.id)) continue;
		const repl = e.kind >= 30000 && e.kind < 40000, key = repl ? `${e.kind}:${e.pubkey}:${Mado.tag(e, "d") || ""}` : e.id;
		if (repl && deleted.has(key)) continue;
		const prev = map.get(key); if (!prev || e.created_at > prev.created_at) map.set(key, e);
	}
	const inc = (c.includeTags || []).map(norm).filter(Boolean), exc = (c.excludeTags || []).map(norm).filter(Boolean);
	return [...map.values()].map(e => {
		const art = e.kind === 30023, d = Mado.tag(e, "d");
		const tags = [...new Set(e.tags.filter(t => t[0] === "t" && t[1]).map(t => norm(t[1])))];
		if (!art) for (const m of (e.content || "").matchAll(/(?:^|\s)#([\p{L}\p{N}_]+)/gu)) { const t = norm(m[1]); if (!tags.includes(t)) tags.push(t); }
		const text = Mado.stripMd(e.content || "").replace(/\s+/g, " ").trim();
		return {
			slug: art && d ? d : e.id, tags,
			title: art ? (Mado.tag(e, "title") || d) : (text.length > 90 ? text.slice(0, 88) + "…" : text),
			summary: art ? (Mado.tag(e, "summary") || "") : "",
			ts: +(Mado.tag(e, "published_at") || e.created_at),
			reply: e.kind === 1 && e.tags.some(t => t[0] === "e" && t[3] !== "mention")
		};
	}).filter(p => {
		if (c.hideReplies && p.reply) return false;
		if (exc.some(t => p.tags.includes(t))) return false;
		if (inc.length) return c.tagMode === "all" ? inc.every(t => p.tags.includes(t)) : inc.some(t => p.tags.includes(t));
		return true;
	}).sort((a, b) => b.ts - a.ts).slice(0, 3);
}
async function loadPosts() {
	try {
		const cfg = Mado.merge(Mado.DEFAULTS, await (await fetch("/blog/config.json", { cache: "no-store" })).json());
		const c = cfg.content, pk = Mado.npubToHex(cfg.author.npub);
		const cached = Mado.store.get(`mado-cache:${pk}:${c.kinds.join(",")}:${c.maxPosts}`);
		if (cached && cached.data) { POSTS = toPosts(cached.data, c); renderPosts(); }
		const evs = await Mado.fetchMany(cfg.relays, { authors: [pk], kinds: [...new Set([...c.kinds, 5])] }, c.maxPosts, cfg.advanced.timeoutMs);
		const own = evs.filter(e => e.pubkey === pk);
		if (own.length || !POSTS) POSTS = toPosts(own, c);
	} catch (e) { if (!POSTS) POSTS = []; }
	renderPosts();
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
	try { localStorage.setItem("lang", b.dataset.lang); } catch (e) {}
	render(b.dataset.lang);
}));
try { const th = localStorage.getItem("theme"); if (th) root.dataset.theme = th; } catch (e) {}
document.getElementById("theme").addEventListener("click", () => {
	const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
	root.dataset.theme = cur === "dark" ? "light" : "dark";
	try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
});
const copied = document.getElementById("copied"); let ct;
document.querySelectorAll("[data-copy]").forEach(a => a.addEventListener("click", async e => {
	e.preventDefault(); let ok = false;
	try { await navigator.clipboard.writeText(a.dataset.copy); ok = true; } catch (err) {}
	copied.textContent = ok ? a.getAttribute("aria-label") + " " + I[L].copied : a.dataset.copy;
	copied.classList.add("show"); clearTimeout(ct);
	ct = setTimeout(() => copied.classList.remove("show"), ok ? 1800 : 6000);
}));
render(pickLang());
window.addEventListener("load", () => { if (window.Mado) loadPosts(); else { POSTS = []; renderPosts(); } });
</script>
